name = "marliin-recipient-worker"
main = "src/index.mjs"
compatibility_date = "2026-07-24"

# Recipient payloads, gated study sections, access events and rate limits.
# One namespace on purpose: the records published before the admin existed
# keep their bare-slug keys and keep working.
[[kv_namespaces]]
binding = "RECIPIENTS"
id = "ba526fa5c702418482f5dc4c93850598"

# Case-study images. Private bucket; bytes are served through the Worker.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "marliin-portfolio-images"

[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
# ALLOW_ORIGIN unset on purpose: the boundary is the password and the
# unguessable slug, not the request origin, and images are public content.

# Secrets, set once from this folder and never committed:
#   npx wrangler secret put ADMIN_TOKEN       # long random string; gates /api/admin/* and PUT
#   npx wrangler secret put POSTHOG_API_KEY   # optional; phc_... from PostHog
